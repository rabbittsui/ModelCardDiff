<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: the subject is which capability claim is backed by an
  evaluation and which is not. Two core colours: neutral ink #1f2933 for
  structure and labels, verified green #1b6b3a for a claim that resolves to a
  result. One accent, amber #b45309, appears in exactly one place: the uncited
  claim, which is the thing the reader should look at first. A dangling citation
  (an id no result provides) is drawn in ink with a dashed connector so it reads
  as "points nowhere" without competing with the accent.

  Source of every label and number: the sample card samples/incomplete.card and
  its Results section, read verbatim. The three claims and the single result
  (eval-intent-accuracy = accuracy 0.89) are exactly what the CLI reports from
  `modelcarddiff claims samples/incomplete.card`:
    CITES    eval-intent-accuracy   (resolved)
    UNCITED  -                      (the 64 megabytes claim)
    DANGLING eval-sota              (no such result)

  Motion: none.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"
     aria-labelledby="title desc" width="640" height="360">
  <title id="title">Claim to evaluation citations for the sample card</title>
  <desc>Three capability claims from samples/incomplete.card on the left, and the
    evaluations they cite on the right. The first claim cites
    eval-intent-accuracy, which exists in the results. The second claim, about
    64 megabytes of memory, cites nothing and is marked in amber as the uncited
    claim. The third claim cites eval-sota with a dashed connector because no
    result provides that evaluation.</desc>

  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>

  <text x="24" y="34"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="600" fill="#1f2933">Capability claims</text>
  <text x="440" y="34"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="600" fill="#1f2933">Results</text>

  <!-- Connectors first so boxes sit on top. One stroke width per role:
       resolved 2, dangling 2 dashed. -->
  <!-- Claim 1 resolves to eval-intent-accuracy -->
  <line x1="416" y1="96" x2="440" y2="150" stroke="#1b6b3a" stroke-width="2"/>
  <!-- Claim 3 cites eval-sota, which does not exist: dashed to open target -->
  <line x1="416" y1="288" x2="440" y2="230" stroke="#1f2933" stroke-width="2"
        stroke-dasharray="4 4"/>

  <!-- Claim boxes. One corner radius reused: 3. One box stroke: 1.5. -->
  <!-- Claim 1: resolved -->
  <rect x="24" y="64" width="392" height="64" rx="3" fill="#ffffff"
        stroke="#1b6b3a" stroke-width="1.5"/>
  <text x="40" y="90"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="13" fill="#1f2933">Classifies the eight supported intents with</text>
  <text x="40" y="108"
        font-family="-apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif"
        font-size="13" fill="#1f2933">accuracy above 0.88 on the held out split.</text>
  <text x="40" y="122"
