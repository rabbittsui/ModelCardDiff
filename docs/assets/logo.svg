<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: the subject is gating claims in a model card against the
  evidence that backs them. Two core colours: neutral ink #1f2933 for the
  established part of the name, and a verified green #1b6b3a for the part that
  means the claim is backed. One accent, amber #b45309, is not used in the logo
  because the logo states the resolved, healthy case; the accent is reserved for
  the diagram where it marks the one unbacked claim. The wordmark splits the
  compound name at its morpheme boundary: "modelcard" in ink, "diff" in green,
  because the tool's job is the diff that keeps a card honest.

  No mark is added. The tool's core data structure is an ordered list of claims,
  each resolved or not, which a wordmark represents honestly without inventing
  geometry that would not be a literal diagram of that list.

  Motion: none.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 96" role="img"
     aria-labelledby="title desc" width="240" height="96">
  <title id="title">modelcarddiff logo</title>
  <desc>Wordmark reading modelcarddiff, with "modelcard" in dark ink and "diff"
    in green, split at the compound word boundary.</desc>

  <rect x="0" y="0" width="240" height="96" fill="#ffffff"/>

